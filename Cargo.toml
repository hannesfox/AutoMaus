[package]
name = "automaus"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = "0.27.2"
egui = "0.27.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
enigo = "0.2.1"
screenshots = "0.8"
image = "0.25"

# Nur für die Failsafe-Erkennung (Bildschirm-Ecken) auf macOS
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"

# icrate 0.0.4 (via winit/eframe 0.27) meldet auf neueren macOS-Versionen eine
# inkompatible Methoden-Signatur. objc2 prüft das in Debug-Builds und panickt –
# die reine Signaturen-Prüfung ist für uns aber entbehrlich.
[profile.dev.package.objc2]
debug-assertions = false
